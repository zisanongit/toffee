name: Hourly Toffee Token Generator

on:
  schedule:
    - cron: '0 * * * *' # প্রতি ১ ঘণ্টা পর পর অটোমেটিক পাইথন ফাইল রান হবে
  workflow_dispatch:

# REQUIRED: গিটহাবে পুশ করার জন্য রাইট পারমিশন অন করা হলো
permissions:
  contents: write

jobs:
  build-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Toffee Token Generator
        run: python toffee_generator.py

      - name: Commit and Push Updated Playlist
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          if git diff --staged --quiet; then
            echo "No changes in playlist.m3u to commit."
          else
            git commit -m "Auto-updated fresh Toffee stream tokens"
            git push
          fi
