name: Hourly Toffee Token Generator

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python Dependencies
        run: pip install requests

      - name: Run Toffee Token Generator
        run: python toffee_generator.py

      - name: Auto Commit and Push Playlist
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-updated fresh Toffee stream tokens"
          file_pattern: "playlist.m3u"
