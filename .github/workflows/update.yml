name: Hourly Toffee Token Generator

on:
  schedule:
    - cron: '0 * * * *' # প্রতি ১ ঘণ্টা পর পর অটোমেটিক পাইথন ফাইল রান হবে
  workflow_dispatch:

jobs:
  build-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Toffee Token Generator
        run: python toffee_generator.py

      - name: Commit and Push Updated Playlist
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git commit -m "Auto-generated fresh Toffee stream tokens" || exit 0
          git push
